name: jim_hats_mobile

description: "Jim hats mobile app"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0 <3.28.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  shared_preferences: ^2.5.1
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  meta: ^1.15.0
  camera: ^0.11.1
  image_picker: ^1.1.2
  camera_android: ^0.10.10
  google_fonts: ^6.2.1
  dio: ^5.8.0+1
  uuid: ^4.4.2
  connectivity_plus: ^6.1.3
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  network_image_mock: ^2.1.1
  flutter_lints: ^5.0.0
  mockito: ^5.4.5
  build_runner: ^2.4.15
  fake_async: ^1.3.1
  test: ^1.25.8
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon" # can specify file name here e.g. "ic_launcher"
  ios: "AppIcon" # can specify file name here e.g. "My-Launcher-Icon"
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff" # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "assets/icons/icon.png" # only available for Android 8.0 devices and above      
  #adaptive_icon_foreground_inset: 16 # only available for Android 8.0 devices and above
  #adaptive_icon_monochrome: "assets/images/icon-monochrome-432x432.png" # only available for Android 13 devices and above
  remove_alpha_ios: true
  background_color_ios: "#ffffff"