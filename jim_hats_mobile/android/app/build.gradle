plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.mateusnavarro77.jim_hats_mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.mateusnavarro77.jim_hats_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 21
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
    flavorDimensions += "default"
    productFlavors {
        
        create("development") {
            dimension = "default"
            //resValue(
            //    type = "string",
            //    name = "app_name",
            //     value = "Jim Hats.dev"
            //)
            manifestPlaceholders = [appName: "[DEV] Jim Hats"]
            applicationIdSuffix = ".development"
        }
        create("staging") {
            dimension = "default"
            // resValue(
            //     type = "string",
            //     name = "app_name",
            //     value = "Jim Hats.stag"
            // )
            manifestPlaceholders = [appName: "[STG] Jim Hats"]
            applicationIdSuffix = ".staging"
        }
        create("production") {
            dimension = "default"
            // resValue(
            //     type = "string",
            //     name = "app_name",
            //     value = "Jim Hats"
            // )
            manifestPlaceholders = [appName: "Jim Hats"]

            applicationIdSuffix = ".production"
        }
    }
}

flutter {
    source = "../.."
}
